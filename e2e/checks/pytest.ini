[pytest]
# A check lives in a file named check_<group>.py, in a function named
# check_<name>, and is addressed on the command line as <group>.<name> — see
# udeck_e2e/names.py. The `check_` prefix rather than pytest's `test_` keeps
# `swift test`, `pytest` and the lab from ever picking up each other's files.
python_files = check_*.py
python_functions = check_*
python_classes =

# An exception in a thread a check started, or one Python could not raise, is
# otherwise only a warning, and the check would pass. As errors they make the
# check "could not check" — never green.
filterwarnings =
    error::pytest.PytestUnhandledThreadExceptionWarning
    error::pytest.PytestUnraisableExceptionWarning
