name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    env:
      # A secret cannot be read in a job-level `if`, so its presence is turned
      # into a plain value here. Until the repository has a
      # PERSONAL_ACCESS_TOKEN, this job does nothing rather than failing every
      # pull request with an error about a missing token — a red check that
      # nobody can act on is worse than no check.
      HAS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN != '' }}
    steps:
      - name: Explain that the check is not configured yet
        if: env.HAS_TOKEN != 'true'
        run: |
          echo "The CLA check is not configured: no PERSONAL_ACCESS_TOKEN secret."
          echo "Add one with 'repo' scope to enable it. Until then, contributors"
          echo "are asked to agree to docs/cla.md in the pull request itself."

      # Asks a first-time contributor to agree to docs/cla.md by commenting on
      # their pull request, and records the agreement in a file in this repo.
      - name: Check the contributor licence agreement
        if: >
          env.HAS_TOKEN == 'true'
          && ((github.event.issue.pull_request
                && contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA'))
              || github.event_name == 'pull_request_target')
        # Pinned to a released tag. Running a third-party action on
        # pull_request_target gives it write access to this repository, so this
        # is worth pinning to a commit sha once the workflow is switched on.
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: .github/cla-signatures.json
          path-to-document: https://github.com/iillyyaa1997/udeck/blob/main/docs/cla.md
          branch: main
          allowlist: iillyyaa1997,dependabot[bot]
          custom-notsigned-prcomment: >
            Thank you for the contribution. Before it can be merged, please read
            [the contributor licence agreement](https://github.com/iillyyaa1997/udeck/blob/main/docs/cla.md)
            and, if you agree to it, post a comment on this pull request with
            exactly this sentence:
