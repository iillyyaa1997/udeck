name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      # Asks a first-time contributor to agree to docs/cla.md by commenting on
      # their pull request, and records the agreement in a file in this repo.
      #
      # This needs a repository secret named PERSONAL_ACCESS_TOKEN holding a
      # token with `repo` scope, so the action can write the signatures file.
      # Until that secret exists the job is skipped rather than failing every
      # pull request.
      - name: Check the contributor licence agreement
        if: >
          (github.event.issue.pull_request
            && contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA'))
          || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: .github/cla-signatures.json
          path-to-document: https://github.com/iillyyaa1997/udeck/blob/main/docs/cla.md
          branch: main
          allowlist: iillyyaa1997,dependabot[bot]
          custom-notsigned-prcomment: >
            Thank you for the contribution. Before it can be merged, please read
            [the contributor licence agreement](https://github.com/iillyyaa1997/udeck/blob/main/docs/cla.md)
            and, if you agree to it, post a comment on this pull request with
            exactly this sentence:
