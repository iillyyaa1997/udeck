name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Reading the repository is all any job here does with the token. Actions are
# pinned by commit, the version beside each, and no checkout keeps the token in
# .git/config, as in release.yml.
#
# Every Scripts/make-cli.sh call says --version as release.yml's do, with the
# version a tag of this commit would have to name — `make-cli.sh version`, the
# app's CFBundleShortVersionString — so that every check a release makes of
# the number runs here first.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    # macOS 26, because the panel uses NSGlassEffectView. `@available` is a
    # runtime check and does not help when the SDK has never heard of the type:
    # on macos-15 the build fails outright with "cannot find type
    # 'NSGlassEffectView' in scope".
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Show the toolchain
        run: |
          swift --version
          xcodebuild -version
          sw_vers

      - name: Build
        run: swift build --build-tests

      # The plugin tests run real child processes against the fixtures in
      # examples/, including one that hangs on purpose, so they are not fast
      # and must not be run in parallel with each other.
      #
      # uDeck's own tests, and only those: here every test target runs in one
      # process, and the plugin format's tests hold the cooperative pool's
      # threads for minutes with the git and plugin processes they wait on.
      # Beside them, on a runner of three cores, a card action's 0.2 s pause
      # took 160 s to come back, and its sleep had ended by then (run
      # 36885251320). The format's tests run in the package, below.
      - name: Test
        run: swift test --skip PluginFormatTests

      - name: Test the plugin format
        working-directory: Packages/UDeckPluginFormat
        run: swift test --skip UDeckPluginFormatTimingTests

      # The plugin format's timing tests keep every core busy for seconds, so
      # they run here, on their own, and never beside uDeck's test of the host's
      # CPU time above.
      - name: Test how long the plugin format takes to read
        working-directory: Packages/UDeckPluginFormat
        # One at a time, too: two timing tests side by side measure each other.
        run: swift test --filter UDeckPluginFormatTimingTests --no-parallel

      # Every test takes away the temporary folder it made — a
      # `TemporaryDirectory`, kept alive for as long as the folder is used. One
      # that let it go too early left the folder behind on every run, and
      # 91,193 of them piled up on one Mac before anybody looked. A folder left
      # here is that leak back.
      - name: Check that the tests left no temporary folders behind
        run: |
          set -eu
          # TMPDIR, and on a Mac the user's temporary folder, where Foundation
          # puts them even when TMPDIR names another.
          left=0
          for dir in "${TMPDIR:-/tmp}" "$(getconf DARWIN_USER_TEMP_DIR 2>/dev/null || true)"; do
            if [ -z "$dir" ] || [ ! -d "$dir" ]; then continue; fi
            found=$(find "$dir" -maxdepth 1 -name 'udeck-tests-*' | wc -l | tr -d ' ')
            if [ "$found" -ne 0 ]; then
              echo "the tests left $found udeck-tests-* folders in $dir:" >&2
              find "$dir" -maxdepth 1 -name 'udeck-tests-*' | head -20 >&2
              left=$((left + found))
            fi
          done
          test "$left" -eq 0
          echo "no udeck-tests-* folder left behind"

      # The lab in e2e/ drives real machines, and hosted runners have no nested
      # virtualisation — but its own tests need neither Tart nor a machine, and
      # they are the ones worth running everywhere: what they cover is the
      # harness, where a mistake is invisible. A check that proves nothing looks
      # exactly like a check that passed.
      - name: Install uv, which the lab runs its Python through
        run: brew install uv

      - name: Test the lab's harness
        run: |
          # Absolute: uv reads a relative one from e2e/ and would quietly make a
          # second environment there.
          export UV_PROJECT_ENVIRONMENT="$PWD/.build/e2e/venv"
          uv sync --frozen --project e2e
          "$UV_PROJECT_ENVIRONMENT/bin/python" -m pytest e2e/tests -q -p no:cacheprovider

      # The examples are documentation and test fixtures at once, so they are
      # held to what any plugin repository's CI holds a plugin to — by the same
      # command, `udeck-plugin check --strict`, rather than a list of shapes of
      # this workflow's own: a manifest uDeck reads with no field the contract
      # lacks, translations that parse, a README, a producer committed as
      # executable. And with no warning either, so that a missing translation
      # (rule 11) still fails here: an example is what a plugin should look like.
      - name: Check the example plugins as a plugin repository's CI would
        run: |
          set -euo pipefail
          swift build --package-path Packages/UDeckPluginFormat --product udeck-plugin
          bin=$(swift build --package-path Packages/UDeckPluginFormat --show-bin-path)
          "$bin/udeck-plugin" check --strict examples/*/ | tee .build/examples-check.txt
          examples=$(ls -d examples/*/ | wc -l | tr -d ' ')
          clean=$(grep -c '^checked examples/.* at [0-9a-f]\{12\} strictly: 0 errors, 0 warnings$' .build/examples-check.txt || true)
          test "$clean" -eq "$examples"

      # Whichever examples carry a Python suite, rather than a name that has
      # to be edited here every time the example set changes.
      - name: Run the plugins' own tests
        run: |
          set -euo pipefail
          for plugin in examples/*/; do
            ls "$plugin"test_*.py >/dev/null 2>&1 || continue
            echo "== $(basename "$plugin")"
            python3 -m unittest discover -s "$plugin" -p 'test_*.py' -v
          done

      # What a release publishes for a Mac — udeck-plugin for arm64 and x86_64
      # in one binary, signed as the copy inside uDeck.app — made on every
      # push, by the script release.yml runs, and published nowhere: a change
      # to either is proved here before a tag needs it.
      - name: Make the udeck-plugin archive for macOS, as a release does
        run: Scripts/make-cli.sh macos --version "$(Scripts/make-cli.sh version)" --out release-cli

      - name: Keep it for the release's dry run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: udeck-plugin-macos
          path: release-cli/udeck-plugin-*-macos-universal.tar.gz
          if-no-files-found: error
          retention-days: 7

  # The plugin format has to build and pass its tests on Linux as well: it is
  # what the repository check will be built from (stage 2), and a plugin
  # repository's CI runs on Linux. Nothing else in this repository is built
  # here — the app needs AppKit — which is why the format is a package of its
  # own, Packages/UDeckPluginFormat.
  plugin-format-linux:
    name: Plugin format on Linux (${{ matrix.arch }})
    # A build or a git that hangs would otherwise hold the runner for six hours.
    timeout-minutes: 30
    strategy:
      # Each architecture reports for itself: a failure on one says nothing
      # about the other, and must not cancel it.
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Swift 6.4.0 exactly, pinned by digest rather than by tag: the Static Linux
    # SDK below has to match the toolchain release for release, and a tag can
    # be moved to another build. The digest is the multi-architecture one, so
    # the same line serves both runners.
    container: swift:6.4.0-noble@sha256:64bab762bc73a3fda6d9ebc559258bd6d7660c10a705bb25ecacad2f99d066f9
    env:
      # The SDK and its checksum as swift.org lists them for 6.4.0
      # (https://www.swift.org/api/v1/install/releases.json).
      STATIC_SDK_URL: https://download.swift.org/swift-6.4.0-release/static-sdk/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE_static-linux-0.1.0.artifactbundle.tar.gz
      STATIC_SDK_CHECKSUM: 47d2fd89eebfdf9eb4d536b6710414297f755c17926cdebc4742c08982b40a9e
    defaults:
      run:
        working-directory: Packages/UDeckPluginFormat
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Show the toolchain
        run: |
          swift --version
          uname -m
          git --version

      - name: Build
        run: swift build --build-tests

      # The corpus tests build a few hundred git repositories, so git has to be
      # there; the image has it.
      - name: Test
        run: swift test --skip UDeckPluginFormatTimingTests

      # The timing tests on their own and one at a time, as on the Mac.
      - name: Test how long the plugin format takes to read
        run: swift test --filter UDeckPluginFormatTimingTests --no-parallel

      # As on the Mac: every test takes away the temporary folder it made.
      - name: Check that the tests left no temporary folders behind
        run: |
          set -eu
          # TMPDIR, and on a Mac the user's temporary folder, where Foundation
          # puts them even when TMPDIR names another.
          left=0
          for dir in "${TMPDIR:-/tmp}" "$(getconf DARWIN_USER_TEMP_DIR 2>/dev/null || true)"; do
            if [ -z "$dir" ] || [ ! -d "$dir" ]; then continue; fi
            found=$(find "$dir" -maxdepth 1 -name 'udeck-tests-*' | wc -l | tr -d ' ')
            if [ "$found" -ne 0 ]; then
              echo "the tests left $found udeck-tests-* folders in $dir:" >&2
              find "$dir" -maxdepth 1 -name 'udeck-tests-*' | head -20 >&2
              left=$((left + found))
            fi
          done
          test "$left" -eq 0
          echo "no udeck-tests-* folder left behind"

      - name: Install the Static Linux SDK
        run: swift sdk install "$STATIC_SDK_URL" --checksum "$STATIC_SDK_CHECKSUM"

      # A static musl binary runs on any Linux of its architecture, with
      # nothing installed — what a repository's CI downloads and runs. Built,
      # stripped, held to being static and archived by the script release.yml
      # runs (`--build-system native` is in it, and why); the log says its
      # size as linked and stripped. If this step fails on one architecture,
      # that is the finding: the SDK does not build for it at this release.
      - name: Make the udeck-plugin archive for Linux, as a release does
        working-directory: .
        run: Scripts/make-cli.sh linux --arch "${{ matrix.arch }}" --version "$(Scripts/make-cli.sh version)" --out release-cli

      # What runs here is what the archive holds — the stripped binary a
      # release publishes, unpacked as a repository's CI unpacks it.
      - name: Check that the archived binary runs
        run: |
          set -eu
          unpacked="$(mktemp -d)"
          tar -xzf ../../release-cli/udeck-plugin-*-linux-${{ matrix.arch }}.tar.gz -C "$unpacked"
          binary="$(echo "$unpacked"/udeck-plugin-*/udeck-plugin)"
          ls -l "$binary"
          "$binary" --version | tee out.txt
          grep -q '^udeck-plugin [0-9]*\.[0-9]*\.[0-9]*$' out.txt
          # With nothing to do it says how to use it and exits 2, "could not check".
          status=0
          "$binary" > out.txt 2> err.txt || status=$?
          test "$status" -eq 2
          grep -q '^usage: udeck-plugin' err.txt
          # And it checks: the examples, strictly, read through git — the static
          # binary starting git itself, which only Linux can show. The checkout
          # was made for the runner and is read here as root, so reading it
          # "at <commit>" rather than "on disk" is safe.directory at work.
          "$binary" check --strict ../../examples/*/ | tee out.txt
          test "$(grep -c '^checked .* at [0-9a-f]\{12\} strictly: 0 errors' out.txt)" -eq 4
          # A plugin repository made here, as an author makes one: clean at its
          # first commit, both for check-repo and for check, and a change
          # without a new version refused against the commit before (rule 18).
          repo="$(mktemp -d)/repository"
          mkdir -p "$repo/plugins"
          cp -R ../../examples/hello-card "$repo/plugins/hello-card"
          printf '{"format": 1, "name": "Made in CI"}\n' > "$repo/udeck-plugins.json"
          commit() { git -C "$repo" -c user.name=CI -c user.email=ci@example.invalid commit -q "$@"; }
          git -C "$repo" init -q -b main
          git -C "$repo" add -A
          commit -m "A plugin"
          "$binary" check-repo --strict --repo "$repo" | tee out.txt
          grep -q '^checked 1 plugin folder at [0-9a-f]\{12\} strictly: 0 errors, [0-9]* warnings\?$' out.txt
          "$binary" check --strict "$repo/plugins/hello-card" | tee out.txt
          grep -q "^checked $repo/plugins/hello-card at [0-9a-f]\\{12\\} strictly: 0 errors" out.txt
          printf '\nChanged.\n' >> "$repo/plugins/hello-card/README.md"
          commit -a -m "A change without a new version"
          status=0
          "$binary" check-repo --repo "$repo" > out.txt || status=$?
          cat out.txt
          test "$status" -eq 1
          grep -q '^error: plugins/hello-card/manifest.json: the folder changed.*\[rule 18\]$' out.txt

      - name: Keep the archive for the image and the release's dry run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: udeck-plugin-linux-${{ matrix.arch }}
          path: release-cli/udeck-plugin-*-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  # The image a release pushes to ghcr.io, made here on every push from the
  # archives above the way a release makes it, all the way: built once and
  # pushed to the job's own registry, pulled from it by its digest and run on
  # both platforms, then copied by that digest to a second registry — one that
  # asks for a login, as ghcr.io does, so that the blobs travel from one
  # registry to another and the copy goes with a credential — read back, and
  # written into udeck-plugin-image.txt. Nothing leaves the runner: the second
  # registry is a container of the job's, its password made here for this run
  # alone, and nothing writes to packages.
  udeck-plugin-image:
    name: udeck-plugin image, built, run and copied, not published
    needs: plugin-format-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      registry:
        image: registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Take the Linux archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: udeck-plugin-linux-*
          path: release-cli
          merge-multiple: true

      - name: Build the image, and run it from the job's registry on both platforms
        run: Scripts/make-cli.sh image --version "$(Scripts/make-cli.sh version)" --out release-cli --revision "$GITHUB_SHA"

      # As a release gathers them: read out of the image that ran, from aports
      # by git and from Alpine's distfiles — afresh on every push, with no
      # cache, so that the downloads a release makes are the ones proved here.
      - name: Gather the sources of the image's GPL and LGPL packages, as a release does
        run: Scripts/make-cli.sh sources --version "$(Scripts/make-cli.sh version)" --out release-cli

      # registry:2 as the service above, by the same digest, on :5001 and with
      # htpasswd: a password of this run's own — openssl's, masked in the log —
      # and the bcrypt the registry asks for, by htpasswd (apache2-utils, which
      # the runner's Apache brings).
      - name: Start a second registry, which asks for a login
        run: |
          set -euo pipefail
          auth="$RUNNER_TEMP/second-registry"
          mkdir -p "$auth"
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          printf '%s' "$password" > "$auth/password"
          htpasswd -Bbn ci "$password" > "$auth/htpasswd"
          docker run -d --name second-registry -p 5001:5000 -v "$auth/htpasswd:/auth/htpasswd:ro" \
            -e REGISTRY_AUTH=htpasswd -e REGISTRY_AUTH_HTPASSWD_REALM=udeck-ci \
            -e REGISTRY_AUTH_HTPASSWD_PATH=/auth/htpasswd \
            registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          # Up, and asking: 401 without a login.
          for _ in $(seq 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5001/v2/ || true)"
            [ "$code" = 401 ] && exit 0
            sleep 1
          done
          echo "the second registry did not come up asking for a login (last answer: $code)" >&2
          exit 1

      # Logged in just for the copy, and out again whatever it did — as a
      # release logs in to ghcr.io.
      - name: Log in to the second registry
        run: docker login localhost:5001 --username ci --password-stdin < "$RUNNER_TEMP/second-registry/password"

      - name: Copy the image that ran to the second registry, as a release pushes it
        run: Scripts/make-cli.sh push --version "$(Scripts/make-cli.sh version)" --out release-cli --repository localhost:5001/iillyyaa1997/udeck-plugin

      - name: Log out of the second registry
        if: always()
        run: docker logout localhost:5001

      - name: Keep the image's file and its sources for the release's dry run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: udeck-plugin-image
          path: |
            release-cli/udeck-plugin-image.txt
            release-cli/udeck-plugin-image-sources-*.tar
          if-no-files-found: error
          retention-days: 7

  # What a tag would publish besides the app: the three archives under one
  # version, the image's file and its sources, SHA256SUMS over the five and the
  # notes, written and checked by the commands release.yml's last job runs. Then the release
  # is pinned as a plugin repository pins one, and the pin read as its CI will.
  release-assets:
    name: The release's udeck-plugin assets, not published
    needs: [build-and-test, plugin-format-linux, udeck-plugin-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Take the archives, the image's file and its sources
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: udeck-plugin-*
          path: release-cli
          merge-multiple: true

      - name: Write and check SHA256SUMS, as a release does
        run: |
          Scripts/make-cli.sh sums --version "$(Scripts/make-cli.sh version)" --out release-cli --repository localhost:5001/iillyyaa1997/udeck-plugin
          ls -l release-cli

      - name: Write the notes, as a release does
        run: Scripts/make-cli.sh notes --version "$(Scripts/make-cli.sh version)" --out release-cli --repository localhost:5001/iillyyaa1997/udeck-plugin

      # The release above, laid out on disk as GitHub lays out its releases,
      # pinned by the static Linux command from its own archive with the
      # runner's curl; the lock file then read by the shell reader in
      # docs/plugin-repository.md — what a plugin repository's CI runs — and
      # the archive checked against the sum it read; and a lock file one sum
      # off is a failed --check, not a quiet pass.
      - name: Pin the release as a plugin repository does, and read the pin as its CI will
        run: |
          set -euo pipefail
          version="$(Scripts/make-cli.sh version)"
          releases="$RUNNER_TEMP/releases"
          mkdir -p "$releases/download/v$version" "$releases/latest/download"
          cp release-cli/SHA256SUMS release-cli/udeck-plugin-image.txt release-cli/udeck-plugin-*.tar.gz \
            "release-cli/udeck-plugin-image-sources-$version.tar" "$releases/download/v$version/"
          cp release-cli/udeck-plugin-image.txt "$releases/latest/download/"
          tar -xzf "release-cli/udeck-plugin-$version-linux-x86_64.tar.gz" -C "$RUNNER_TEMP"
          command="$RUNNER_TEMP/udeck-plugin-$version-linux-x86_64/udeck-plugin"
          repo="$RUNNER_TEMP/plugins-repository"
          mkdir -p "$repo"
          printf '{"format": 1, "name": "Pinned in CI"}\n' > "$repo/udeck-plugins.json"
          export UDECK_PLUGIN_DOWNLOAD_BASE="file://$releases/download"
          "$command" pin --repo "$repo"
          "$command" pin --repo "$repo" --check
          "$command" pin --repo "$repo" --check --version latest
          awk '/^<!-- \/lock-reader -->$/ { inside = 0 } inside && !/^```/ { print } /^<!-- lock-reader -->$/ { inside = 1 }' \
            docs/plugin-repository.md > "$RUNNER_TEMP/read-lock.sh"
          sh -eu -c '
            . "$1"
            read_udeck_plugin_lock "$2"
            test "$version" = "$4"
            cd "$3/download/v$version"
            echo "$linux_x86_64  udeck-plugin-$version-linux-x86_64.tar.gz" | sha256sum -c -
            echo "$linux_aarch64  udeck-plugin-$version-linux-aarch64.tar.gz" | sha256sum -c -
            echo "$macos_universal  udeck-plugin-$version-macos-universal.tar.gz" | sha256sum -c -
            grep -qx "digest=$image" udeck-plugin-image.txt
            grep " udeck-plugin-image-sources-$version.tar\$" SHA256SUMS | sha256sum -c -
          ' sh "$RUNNER_TEMP/read-lock.sh" "$repo/.github/udeck-plugin.lock" "$releases" "$version"
          lock="$repo/.github/udeck-plugin.lock"
          first="$(sed -n 's/^linux-x86_64=\(.\).*/\1/p' "$lock")"
          if [ "$first" = 0 ]; then other=1; else other=0; fi
          sed "s/^linux-x86_64=./linux-x86_64=$other/" "$lock" > "$RUNNER_TEMP/changed.lock"
          cp "$RUNNER_TEMP/changed.lock" "$lock"
          status=0
          "$command" pin --repo "$repo" --check || status=$?
          test "$status" -eq 1
