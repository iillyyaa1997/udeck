name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    # macOS 26, because the panel uses NSGlassEffectView. `@available` is a
    # runtime check and does not help when the SDK has never heard of the type:
    # on macos-15 the build fails outright with "cannot find type
    # 'NSGlassEffectView' in scope".
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show the toolchain
        run: |
          swift --version
          xcodebuild -version
          sw_vers

      - name: Build
        run: swift build --build-tests

      # The plugin tests run real child processes against the fixtures in
      # examples/, including one that hangs on purpose, so they are not fast
      # and must not be run in parallel with each other.
      #
      # uDeck's own tests, and only those: here every test target runs in one
      # process, and the plugin format's tests hold the cooperative pool's
      # threads for minutes with the git and plugin processes they wait on.
      # Beside them, on a runner of three cores, a card action's 0.2 s pause
      # took 160 s to come back, and its sleep had ended by then (run
      # 36885251320). The format's tests run in the package, below.
      - name: Test
        run: swift test --skip PluginFormatTests

      - name: Test the plugin format
        working-directory: Packages/UDeckPluginFormat
        run: swift test --skip UDeckPluginFormatTimingTests

      # The plugin format's timing tests keep every core busy for seconds, so
      # they run here, on their own, and never beside uDeck's test of the host's
      # CPU time above.
      - name: Test how long the plugin format takes to read
        working-directory: Packages/UDeckPluginFormat
        # One at a time, too: two timing tests side by side measure each other.
        run: swift test --filter UDeckPluginFormatTimingTests --no-parallel

      # Every test takes away the temporary folder it made — a
      # `TemporaryDirectory`, kept alive for as long as the folder is used. One
      # that let it go too early left the folder behind on every run, and
      # 91,193 of them piled up on one Mac before anybody looked. A folder left
      # here is that leak back.
      - name: Check that the tests left no temporary folders behind
        run: |
          set -eu
          # TMPDIR, and on a Mac the user's temporary folder, where Foundation
          # puts them even when TMPDIR names another.
          left=0
          for dir in "${TMPDIR:-/tmp}" "$(getconf DARWIN_USER_TEMP_DIR 2>/dev/null || true)"; do
            if [ -z "$dir" ] || [ ! -d "$dir" ]; then continue; fi
            found=$(find "$dir" -maxdepth 1 -name 'udeck-tests-*' | wc -l | tr -d ' ')
            if [ "$found" -ne 0 ]; then
              echo "the tests left $found udeck-tests-* folders in $dir:" >&2
              find "$dir" -maxdepth 1 -name 'udeck-tests-*' | head -20 >&2
              left=$((left + found))
            fi
          done
          test "$left" -eq 0
          echo "no udeck-tests-* folder left behind"

      # The lab in e2e/ drives real machines, and hosted runners have no nested
      # virtualisation — but its own tests need neither Tart nor a machine, and
      # they are the ones worth running everywhere: what they cover is the
      # harness, where a mistake is invisible. A check that proves nothing looks
      # exactly like a check that passed.
      - name: Install uv, which the lab runs its Python through
        run: brew install uv

      - name: Test the lab's harness
        run: |
          # Absolute: uv reads a relative one from e2e/ and would quietly make a
          # second environment there.
          export UV_PROJECT_ENVIRONMENT="$PWD/.build/e2e/venv"
          uv sync --frozen --project e2e
          "$UV_PROJECT_ENVIRONMENT/bin/python" -m pytest e2e/tests -q -p no:cacheprovider

      # The examples are documentation and test fixtures at once, so they are
      # held to what any plugin repository's CI holds a plugin to — by the same
      # command, `udeck-plugin check --strict`, rather than a list of shapes of
      # this workflow's own: a manifest uDeck reads with no field the contract
      # lacks, translations that parse, a README, a producer committed as
      # executable. And with no warning either, so that a missing translation
      # (rule 11) still fails here: an example is what a plugin should look like.
      - name: Check the example plugins as a plugin repository's CI would
        run: |
          set -euo pipefail
          swift build --package-path Packages/UDeckPluginFormat --product udeck-plugin
          bin=$(swift build --package-path Packages/UDeckPluginFormat --show-bin-path)
          "$bin/udeck-plugin" check --strict examples/*/ | tee .build/examples-check.txt
          examples=$(ls -d examples/*/ | wc -l | tr -d ' ')
          clean=$(grep -c '^checked examples/.* at [0-9a-f]\{12\} strictly: 0 errors, 0 warnings$' .build/examples-check.txt || true)
          test "$clean" -eq "$examples"

      # Whichever examples carry a Python suite, rather than a name that has
      # to be edited here every time the example set changes.
      - name: Run the plugins' own tests
        run: |
          set -euo pipefail
          for plugin in examples/*/; do
            ls "$plugin"test_*.py >/dev/null 2>&1 || continue
            echo "== $(basename "$plugin")"
            python3 -m unittest discover -s "$plugin" -p 'test_*.py' -v
          done

  # The plugin format has to build and pass its tests on Linux as well: it is
  # what the repository check will be built from (stage 2), and a plugin
  # repository's CI runs on Linux. Nothing else in this repository is built
  # here — the app needs AppKit — which is why the format is a package of its
  # own, Packages/UDeckPluginFormat.
  plugin-format-linux:
    name: Plugin format on Linux (${{ matrix.arch }})
    # A build or a git that hangs would otherwise hold the runner for six hours.
    timeout-minutes: 30
    strategy:
      # Each architecture reports for itself: a failure on one says nothing
      # about the other, and must not cancel it.
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Swift 6.4.0 exactly, pinned by digest rather than by tag: the Static Linux
    # SDK below has to match the toolchain release for release, and a tag can
    # be moved to another build. The digest is the multi-architecture one, so
    # the same line serves both runners.
    container: swift:6.4.0-noble@sha256:64bab762bc73a3fda6d9ebc559258bd6d7660c10a705bb25ecacad2f99d066f9
    env:
      # The SDK and its checksum as swift.org lists them for 6.4.0
      # (https://www.swift.org/api/v1/install/releases.json).
      STATIC_SDK_URL: https://download.swift.org/swift-6.4.0-release/static-sdk/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE_static-linux-0.1.0.artifactbundle.tar.gz
      STATIC_SDK_CHECKSUM: 47d2fd89eebfdf9eb4d536b6710414297f755c17926cdebc4742c08982b40a9e
    defaults:
      run:
        working-directory: Packages/UDeckPluginFormat
    steps:
      - uses: actions/checkout@v4

      - name: Show the toolchain
        run: |
          swift --version
          uname -m
          git --version

      - name: Build
        run: swift build --build-tests

      # The corpus tests build a few hundred git repositories, so git has to be
      # there; the image has it.
      - name: Test
        run: swift test --skip UDeckPluginFormatTimingTests

      # The timing tests on their own and one at a time, as on the Mac.
      - name: Test how long the plugin format takes to read
        run: swift test --filter UDeckPluginFormatTimingTests --no-parallel

      # As on the Mac: every test takes away the temporary folder it made.
      - name: Check that the tests left no temporary folders behind
        run: |
          set -eu
          # TMPDIR, and on a Mac the user's temporary folder, where Foundation
          # puts them even when TMPDIR names another.
          left=0
          for dir in "${TMPDIR:-/tmp}" "$(getconf DARWIN_USER_TEMP_DIR 2>/dev/null || true)"; do
            if [ -z "$dir" ] || [ ! -d "$dir" ]; then continue; fi
            found=$(find "$dir" -maxdepth 1 -name 'udeck-tests-*' | wc -l | tr -d ' ')
            if [ "$found" -ne 0 ]; then
              echo "the tests left $found udeck-tests-* folders in $dir:" >&2
              find "$dir" -maxdepth 1 -name 'udeck-tests-*' | head -20 >&2
              left=$((left + found))
            fi
          done
          test "$left" -eq 0
          echo "no udeck-tests-* folder left behind"

      - name: Install the Static Linux SDK
        run: swift sdk install "$STATIC_SDK_URL" --checksum "$STATIC_SDK_CHECKSUM"

      # A static musl binary runs on any Linux of its architecture, with
      # nothing installed — what a repository's CI downloads and runs.
      # `--build-system native`: with Swift 6.4.0's default build system a
      # static Swift standard library with Foundation fails to link on Linux
      # (swiftlang/swift-build#1764). If this step fails on one architecture,
      # that is the finding: the SDK does not build for it at this release.
      - name: Build udeck-plugin as a static musl binary
        run: |
          swift build -c release --build-system native \
            --swift-sdk "${{ matrix.arch }}-swift-linux-musl" --product udeck-plugin

      - name: Check that the binary is static and runs
        run: |
          set -eu
          bin=$(swift build -c release --build-system native \
            --swift-sdk "${{ matrix.arch }}-swift-linux-musl" --show-bin-path)
          binary="$bin/udeck-plugin"
          ls -l "$binary"
          readelf -h "$binary" | grep 'Machine:'
          if readelf -l "$binary" | grep -q 'INTERP'; then
            echo "udeck-plugin asks for a dynamic loader; it is not a static binary" >&2
            exit 1
          fi
          if readelf -d "$binary" | grep -q 'NEEDED'; then
            echo "udeck-plugin needs shared libraries; it is not a static binary" >&2
            readelf -d "$binary" | grep 'NEEDED' >&2
            exit 1
          fi
          "$binary" --version | tee out.txt
          grep -q '^udeck-plugin [0-9]*\.[0-9]*\.[0-9]*$' out.txt
          # With nothing to do it says how to use it and exits 2, "could not check".
          status=0
          "$binary" > out.txt 2> err.txt || status=$?
          test "$status" -eq 2
          grep -q '^usage: udeck-plugin' err.txt
          # And it checks: the examples, strictly, read through git — the static
          # binary starting git itself, which only Linux can show. The checkout
          # was made for the runner and is read here as root, so reading it
          # "at <commit>" rather than "on disk" is safe.directory at work.
          "$binary" check --strict ../../examples/*/ | tee out.txt
          test "$(grep -c '^checked .* at [0-9a-f]\{12\} strictly: 0 errors' out.txt)" -eq 4
          # A plugin repository made here, as an author makes one: clean at its
          # first commit, both for check-repo and for check, and a change
          # without a new version refused against the commit before (rule 18).
          repo="$(mktemp -d)/repository"
          mkdir -p "$repo/plugins"
          cp -R ../../examples/hello-card "$repo/plugins/hello-card"
          printf '{"format": 1, "name": "Made in CI"}\n' > "$repo/udeck-plugins.json"
          commit() { git -C "$repo" -c user.name=CI -c user.email=ci@example.invalid commit -q "$@"; }
          git -C "$repo" init -q -b main
          git -C "$repo" add -A
          commit -m "A plugin"
          "$binary" check-repo --strict --repo "$repo" | tee out.txt
          grep -q '^checked 1 plugin folder at [0-9a-f]\{12\} strictly: 0 errors, [0-9]* warnings\?$' out.txt
          "$binary" check --strict "$repo/plugins/hello-card" | tee out.txt
          grep -q "^checked $repo/plugins/hello-card at [0-9a-f]\\{12\\} strictly: 0 errors" out.txt
          printf '\nChanged.\n' >> "$repo/plugins/hello-card/README.md"
          commit -a -m "A change without a new version"
          status=0
          "$binary" check-repo --repo "$repo" > out.txt || status=$?
          cat out.txt
          test "$status" -eq 1
          grep -q '^error: plugins/hello-card/manifest.json: the folder changed.*\[rule 18\]$' out.txt
